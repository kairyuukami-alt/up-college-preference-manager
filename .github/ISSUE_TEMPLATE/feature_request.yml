name: Feature request
description: Propose an improvement to counselling operations.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this and what task is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe what the user should be able to do.
    validations:
      required: true
