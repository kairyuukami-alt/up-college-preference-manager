name: UP Result Scrape
on:
  push:
    branches: [tmp-up-result-scrape-2026-09-07]
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test one institute result table
        run: |
          pip install requests beautifulsoup4
          python - <<'PY'
          import json, requests, urllib3
          from bs4 import BeautifulSoup
          urllib3.disable_warnings(); H={'User-Agent':'Mozilla/5.0'}
          base='https://upneet.gov.in/vaccant_result/'; ss=requests.Session()
          r=ss.get(base+'vseat_stream.aspx',verify=False,timeout=60,headers=H); s=BeautifulSoup(r.text,'html.parser')
          d={x['name']:x.get('value','') for x in s.find_all('input') if x.get('name') and x.get('type')=='hidden'}; d['__EVENTTARGET']='ctl00$ContentPlaceHolder1$3'; d['__EVENTARGUMENT']=''
          ss.post(base+'vseat_stream.aspx',data=d,verify=False,timeout=90,headers=H)
          r=ss.get(base+'onallotmainCStatus.aspx',verify=False,timeout=90,headers=H); s=BeautifulSoup(r.text,'html.parser')
          d={x['name']:x.get('value','') for x in s.find_all('input') if x.get('name') and x.get('type')=='hidden'}
          d['ctl00$ContentPlaceHolder1$DDL_Institute']='021'; d['ctl00$ContentPlaceHolder1$Submit']='Submit'
          r2=ss.post(base+'onallotmainCStatus.aspx',data=d,verify=False,timeout=120,headers=H)
          print('STATUS',r2.status_code,'LEN',len(r2.text),'URL',r2.url)
          open('one.html','w',encoding='utf-8').write(r2.text)
          q=BeautifulSoup(r2.text,'html.parser'); out={'tables':[],'text':q.get_text(' ',strip=True)[:30000]}
          for i,t in enumerate(q.find_all('table')):
            rows=[]
            for tr in t.find_all('tr')[:500]: rows.append([c.get_text(' ',strip=True) for c in tr.find_all(['th','td'])])
            out['tables'].append({'index':i,'id':t.get('id'),'rows':rows})
          open('one.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False)[:100000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: up-one-institute
          path: |
            one.html
            one.json
          retention-days: 1
