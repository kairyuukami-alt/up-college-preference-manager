name: UP Result Scrape
on:
  push:
    branches: [tmp-up-result-scrape-2026-09-07]
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect allotted-list endpoint
        run: |
          pip install requests beautifulsoup4
          python - <<'PY'
          import json, requests, urllib3
          from bs4 import BeautifulSoup
          urllib3.disable_warnings()
          u='https://upneet.gov.in/vaccant_result/vseat_stream.aspx'
          r=requests.get(u,verify=False,timeout=60,headers={'User-Agent':'Mozilla/5.0'})
          print('STATUS',r.status_code,'LEN',len(r.text),'URL',r.url)
          open('vseat.html','w',encoding='utf-8').write(r.text)
          s=BeautifulSoup(r.text,'html.parser')
          out={'status':r.status_code,'url':r.url,'selects':[],'inputs':[],'tables':[],'links':[],'text':s.get_text(' ',strip=True)[:10000]}
          for sel in s.find_all('select'):
            out['selects'].append({'id':sel.get('id'),'name':sel.get('name'),'options':[{'value':o.get('value'),'text':o.get_text(' ',strip=True)} for o in sel.find_all('option')]})
          for inp in s.find_all('input'):
            if inp.get('type') in ['hidden','submit','button']:
              out['inputs'].append({'type':inp.get('type'),'id':inp.get('id'),'name':inp.get('name'),'value':inp.get('value')})
          for i,t in enumerate(s.find_all('table')):
            rows=[]
            for tr in t.find_all('tr')[:100]: rows.append([c.get_text(' ',strip=True) for c in tr.find_all(['th','td'])])
            out['tables'].append({'index':i,'id':t.get('id'),'rows':rows})
          for a in s.find_all('a',href=True):
            if any(x in (a.get_text(' ',strip=True)+' '+a['href']).lower() for x in ['result','allot','vacant','seat']): out['links'].append({'text':a.get_text(' ',strip=True),'href':a['href']})
          open('vseat.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False)[:50000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: up-vseat-diagnostic-correct
          path: |
            vseat.html
            vseat.json
          retention-days: 1
